name: LavozApp

packages:
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-iOS-SDK
    from: "5.2.2"

options:
  bundleIdPrefix: cl.prioridad
  deploymentTarget:
    iOS: "15.0"
  defaultConfig: Debug

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: cl.prioridad.puconapp
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # Agrega tu Team ID de Apple Developer aquí

targets:
  LavozApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: LavozApp
    info:
      path: LavozApp/Info.plist
      properties:
        CFBundleDisplayName: "PuconApp"
        CFBundleName: "PuconApp"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            socios.lavozdepucon.cl:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
            live.mtna.tv:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
    dependencies:
      - package: OneSignal
        product: OneSignalFramework

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.prioridad.puconapp
        CODE_SIGN_ENTITLEMENTS: LavozApp/LavozApp.entitlements

schemes:
  LavozApp:
    build:
      targets:
        LavozApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
